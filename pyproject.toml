[project]
name = "weather-sensor-service"
version = "0.1.0"
description = "REST API for weather sensor readings and aggregate queries"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "ty",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["blackbox: HTTP contract tests against the running stack"]

[tool.ty.environment]
python-version = "3.13"
